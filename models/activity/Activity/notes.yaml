# Notes: the sources, the decisions and their reasons, what is left out. Shown on the model's page.
notes:
  - en: "A playground model: one outdoor activity made from the GPS track (GPX) that a device or app records. One model for all sports, because a ride, a hike and a ski day share almost everything; sport says which it is, and runs and summits apply where they make sense. It replaces Ride (activity 0.1.0) since 0.2.0 (2026-10-11)."
  - en: "sport uses the names of Strava's sport types (checked 2026-10-11 in Strava's API reference, SportType), written with a lower-case first letter: Ride is ride, AlpineSki is alpineSki. Only outdoor sports with a GPS track are listed; more can be added. The mapping table strava.yaml has the correspondence."
  - en: "Reused terms keep their IRIs: name and location from NGSI-LD, startTime and endTime from schema.org, where they mean the same as on an Action. Considered (2026-10-11): schema.org ExerciseAction. Its distance is text with a unit (\"7 ft\"), and it has nothing for elevation, the route geometry or the time in motion, so those are terms of this subject. Activity is not declared a subclass of ExerciseAction, because an activity can also be a commute (TravelAction)."
  - en: "distance, movingDuration, elevationGain and elevationLoss are computed from the track, and apps compute them differently (smoothing of the elevation, when a pause counts as a stop). The values are the recording app's own."
  - en: "location is the route simplified to a few hundred points, enough for a map; the full track with every point stays in the GPX file at trackUrl."
  - en: "Left out: the time of every track point, heart rate, cadence, power and temperature (GPX extensions such as Garmin's TrackPointExtension), speeds (they follow from distance and time), the equipment, and ski areas and lifts (a SkiArea model when a ski day needs one). Each can be added when something needs it."
